plugins {
    id 'com.android.application'
}

android {
    namespace 'it.umberto.ror2calc'
    compileSdk 35

    defaultConfig {
        applicationId 'it.umberto.ror2calc'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // firma con la chiave di debug così l'APK release è installabile subito
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
